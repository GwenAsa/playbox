name: Bug report
description: Report a reproducible problem in PlayBox.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Remove passwords, tokens, and personal information from logs before posting.
  - type: input
    id: version
    attributes:
      label: PlayBox version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: "Distribution and release"
    validations:
      required: true
  - type: input
    id: wine
    attributes:
      label: Wine version
      placeholder: "For example, 11.0 (Staging)"
    validations:
      required: false
  - type: input
    id: affected-app
    attributes:
      label: Affected game or application
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions needed to reproduce the issue.
      placeholder: "1. Open PlayBox..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove sensitive information before sharing.
    validations:
      required: false
