name: Feature request
description: Suggest an improvement to the PlayBox experience.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the workflow or limitation you have encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like PlayBox to do?
      description: Describe the feature or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      validations:
      required: false
